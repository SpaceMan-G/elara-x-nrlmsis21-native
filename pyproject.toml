[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elara-x-nrlmsis21-native"
version = "0.1.0.dev0"
description = "Native Python NRLMSIS 2.1 component for Elara X with verified external parameter-resource handling"
requires-python = ">=3.10"
authors = [{name = "Giuseppe A. A. Joulianou"}]

[tool.setuptools.packages.find]
where = ["src"]
